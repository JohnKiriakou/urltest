<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>url lengthener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --veil-top: rgba(10,8,20,0.55);
    --veil-bot: rgba(6,5,14,0.85);
    --card-bg: rgba(20,16,34,0.72);
    --card-border: rgba(180,160,230,0.18);
    --lavender: #b9a6e0;
    --lavender-soft: #8b7bb5;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Quicksand', system-ui, sans-serif;
    overflow:hidden;
    background:#0a0714;
  }

  .scene{
    position:fixed; inset:0;
    background: radial-gradient(ellipse at 70% 15%, #1a1330 0%, #0a0714 55%, #050408 100%);
    z-index:0;
  }
  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.4); }
  }

  .moon-glow{
    position:absolute; top:8%; right:14%;
    width:180px; height:180px; border-radius:50%;
    background: radial-gradient(circle, rgba(230,220,255,0.35) 0%, rgba(230,220,255,0) 70%);
    filter: blur(4px);
  }
  .moon{
    position:absolute; top:10%; right:16%;
    width:90px; height:90px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fdfbff 0%, #e7ddfa 55%, #c9b9ea 100%);
    box-shadow: 0 0 40px 6px rgba(220,205,255,0.45);
  }

  .mountains{ position:absolute; inset:0; }
  .ridge{ position:absolute; bottom:0; left:0; width:100%; }

  .bird{
    position:absolute; width:14px; height:7px;
    opacity:.55;
  }

  .veil{
    position:fixed; inset:0; z-index:1;
    background: linear-gradient(180deg, var(--veil-top) 0%, var(--veil-bot) 100%);
  }

  .stage{
    position:relative; z-index:2;
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:2vh 1.5vw;
  }
  .card{
    width:100%; height:auto;
    max-width:900px;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    padding:5vh 3vw;
  }

  .content{
    width:100%;
    max-width:900px;
    color:#e9e4f7;
  }
  h1{
    font-size:clamp(32px,5vw,56px);
    font-weight:800;
    letter-spacing:-0.02em;
    margin-bottom:12px;
    background:linear-gradient(90deg,#fff 0%, var(--lavender) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    color:rgba(230,220,255,0.75);
    margin-bottom:32px;
    font-size:18px;
  }
  .form-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  input[type=text]{
    flex:1 1 320px;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid rgba(180,160,230,0.25);
    background:rgba(10,8,20,0.6);
    color:#fff;
    font-size:16px;
    outline:none;
  }
  input[type=text]::placeholder{ color:rgba(230,220,255,0.4); }
  button{
    padding:16px 22px;
    border-radius:16px;
    border:1px solid rgba(185,166,224,0.35);
    background:rgba(185,166,224,0.10);
    color:#fff;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:background .2s ease, opacity .2s ease;
  }
  button:hover{ background:rgba(185,166,224,0.18); opacity:0.95; }
  button:active{ transform:none; }

  .output{
    background:rgba(10,8,20,0.55);
    border:1px dashed rgba(180,160,230,0.25);
    border-radius:14px;
    padding:18px;
    word-break:break-all;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin:10px 0;
  }
  .output a{
    color:var(--lavender);
    text-decoration:none;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:14px;
  }
  .output a:hover{ text-decoration:underline; }
  .meta{
    margin-top:10px;
    font-size:13px;
    color:rgba(230,220,255,0.6);
  }
  .copy{
    margin:0;
    background:rgba(185,166,224,0.18);
    border:none;
    padding:2px 10px;
    border-radius:8px;
    font-size:14px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    color:#e9e4f7;
    font-weight:500;
  }
  .copy:hover{
    background:rgba(185,166,224,0.28);
  }
  .hint{
    margin-top:28px;
    font-size:13px;
    color:rgba(230,220,255,0.5);
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="stars" id="stars"></div>
    <div class="moon-glow"></div>
    <div class="moon"></div>

    <svg class="mountains" viewBox="0 0 1600 900" preserveAspectRatio="none">
      <polygon class="ridge" points="0,900 0,620 180,540 340,600 520,500 700,580 900,480 1100,570 1300,510 1470,600 1600,560 1600,900"
        fill="#161029" opacity="0.85"/>
      <polygon class="ridge" points="0,900 0,700 150,650 300,720 480,630 650,700 850,610 1050,690 1250,630 1450,700 1600,660 1600,900"
        fill="#0f0b1e" opacity="0.92"/>
      <polygon class="ridge" points="0,900 0,780 200,740 420,800 620,730 850,790 1080,720 1300,790 1600,750 1600,900"
        fill="#08060f"/>

      <g stroke="#cfc3ea" stroke-width="2" fill="none" opacity="0.5">
        <path d="M300,180 q10,-14 20,0 q10,-14 20,0"/>
        <path d="M345,205 q8,-11 16,0 q8,-11 16,0"/>
        <path d="M960,140 q10,-14 20,0 q10,-14 20,0"/>
      </g>
    </svg>
  </div>

  <div class="veil"></div>

  <div class="stage">
    <div class="card">
      <div class="content">
        <h1>URL Lengthener</h1>
        <form id="lenForm" autocomplete="off">
          <div class="form-row">
            <input id="targetUrl" type="text" placeholder="https://example.com" required />
            <button type="submit">Lengthen</button>
          </div>
        </form>
        <div id="output" class="output" style="display:none;">
          <div><strong>Your redirect link:</strong></div>
          <div class="link-row">
            <a id="longLink" href="#" target="_blank" rel="noopener"></a>
            <button id="copyBtn" class="copy" type="button">Copy</button>
          </div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const starField = document.getElementById('stars');
    const STAR_COUNT = 140;
    for(let i=0;i<STAR_COUNT;i++){
      const s = document.createElement('div');
      s.className='star';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*70+'%';
      s.style.animationDelay = (Math.random()*3.5)+'s';
      s.style.animationDuration = (2.5+Math.random()*3)+'s';
      starField.appendChild(s);
    }

    (function(){
      const params = new URLSearchParams(window.location.search);
      const redirectTarget = params.get('r');
      if (redirectTarget){
        try{
          let decoded = decodeURIComponent(redirectTarget);
          if (!/^https?:\/\//i.test(decoded)){
            decoded = 'https://' + decoded;
          }
          if (decoded && decoded !== window.location.href){
            window.location.replace(decoded);
          }
        }catch(e){}
        return;
      }

      const form = document.getElementById('lenForm');
      const input = document.getElementById('targetUrl');
      const output = document.getElementById('output');
      const longLinkEl = document.getElementById('longLink');
      const meta = document.getElementById('meta');
      const copyBtn = document.getElementById('copyBtn');

      function makeLongUrl(target){
        const base = window.location.origin + window.location.pathname;
        const enc = encodeURIComponent(target);
        const filler = 'A'.repeat(3000);
        const noise = Array.from({length:50}, (_,i)=>`p${i}=${'x'.repeat(40)}`).join('&');
        return `${base}?r=${enc}&f=${filler}&${noise}`;
      }

      form.addEventListener('submit', (e)=>{
        e.preventDefault();
        const url = input.value.trim();
        if(!url){ return; }
        const text = url;

        const longUrl = makeLongUrl(text);
        longLinkEl.href = longUrl;
        longLinkEl.textContent = text;
        meta.textContent = `Length: ${longUrl.length.toLocaleString()} characters • ${longUrl.split('?')[1]?.length?.toLocaleString()||0} chars of query`;
        output.style.display = 'block';
        output.scrollIntoView({behavior:'smooth', block:'nearest'});
      });

      copyBtn.addEventListener('click', async ()=>{
        try{
          await navigator.clipboard.writeText(longLinkEl.href);
          const old = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          setTimeout(()=>copyBtn.textContent = old, 1500);
        }catch{
          const range = document.createRange();
          range.selectNodeContents(longLinkEl);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
        }
      });
    })();
  </script>

</body>
</html>
